<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Cláudio Victor</title>
    <meta name="description" content="The page you are looking for does not exist." />
    <meta name="robots" content="noindex, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .error-page-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .error-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 48px 36px;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .error-code {
        font-family: var(--font-mono);
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .error-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 12px;
      }
      .error-desc {
        font-size: 15px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }
    </style>
  </head>
  <body>
    <main class="error-page-wrapper" id="main-content">
      <div class="error-card" id="error-card">
        <div class="brand" style="justify-content: center; margin-bottom: 24px;">
          <span class="brand-badge">CV</span>
          <span class="brand-name">Cláudio Victor</span>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page not found.</h1>
        <p class="error-desc">
          The requested resource could not be found or has been moved.
        </p>
        <div>
          <a href="/" class="btn btn-primary" id="btn-back-home">
            <i class="bx bx-left-arrow-alt"></i> Back to homepage
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
